t_camera2gimbal: [0.13392043908386911, 0.083814678300799167, 0.0024113281705605569]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
baudrate: 115200

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 150               #50
Q_yaw: [9e6, 0]     #9e6
R_yaw: [1]

