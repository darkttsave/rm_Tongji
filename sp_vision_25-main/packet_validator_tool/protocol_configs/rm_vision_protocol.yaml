# RM视觉通信协议配置文件
# 用于RoboMaster视觉系统上下位机通信

# 协议基本信息
protocol_name: "RM视觉通信协议"
description: "RoboMaster视觉系统上下位机通信协议"
frame_header: "0xA5"  # 帧头标识符
byte_order: "little"  # 字节序：little(小端) 或 big(大端)

# 数据包字段定义
fields:
  - name: "帧头SOF"
    size: 1              # 字段占用字节数
    type: "uint8"        # 数据类型
    description: "起始标志(0xA5)"
    validation:
      type: "fixed_value"  # 验证类型：固定值
      value: 165           # 0xA5 = 165

  - name: "数据长度"
    size: 2
    type: "uint16"
    description: "数据段长度"

  - name: "序列号"
    size: 1
    type: "uint8"
    description: "包序号"

  - name: "CRC8"
    size: 1
    type: "uint8"
    description: "包头CRC8校验"
    validation:
      type: "crc8"      # 验证类型：CRC8校验
      range: [0, 4]     # 校验范围：从第0字节到第4字节(不包含CRC8字段本身)

  - name: "命令ID"
    size: 2
    type: "uint16"
    description: "命令类型"

  - name: "Yaw角度"
    size: 4
    type: "float"
    description: "偏航角"

  - name: "Pitch角度"
    size: 4
    type: "float"
    description: "俯仰角"

  - name: "距离"
    size: 4
    type: "float"
    description: "目标距离"

  - name: "标志位"
    size: 1
    type: "uint8"
    description: "控制标志"

  - name: "CRC16"
    size: 2
    type: "uint16"
    description: "整包CRC16校验"
    validation:
      type: "crc16"     # 验证类型：CRC16校验
      range: [0, -1]    # 校验范围：从第0字节到倒数第1字节(-1表示到CRC16字段之前)

# 模拟器配置
simulator:
  enabled: true         # 是否启用模拟器
  generate_rules:       # 各字段的生成规则
    "帧头SOF": "fixed:0xA5"                # 固定值
    "序列号": "counter"                     # 递增计数器
    "Yaw角度": "formula:counter*0.1"       # 公式计算
    "Pitch角度": "formula:counter*0.05"    # 公式计算
    "距离": "random:0.5-10.0"              # 随机范围
